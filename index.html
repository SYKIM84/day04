<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>day04</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0E1729;
      --navy-800: #16233D;
      --navy-700: #1E2F52;
      --line: rgba(156, 199, 255, 0.16);
      --line-strong: rgba(156, 199, 255, 0.34);
      --text: #E6ECF7;
      --muted: #93A4C4;
      --accent: #9CC7FF;
    }
    * { box-sizing: border-box; }
    html { background: var(--navy-900); }
    body {
      margin: 0;
      font-family: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 50% -120px, rgba(156, 199, 255, 0.10), transparent 70%),
        var(--navy-900);
      min-height: 100vh;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 16px 96px;
    }
    .top { color: var(--muted); font-size: 14px; }

    h1 {
      margin: 24px 0 36px;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
      max-width: 18em;
      word-break: keep-all;
    }

    ul.pages {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line-strong);
    }
    ul.pages li { border-bottom: 1px solid var(--line); }
    ul.pages a {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 16px;
      padding: 22px 0;
      color: inherit;
      text-decoration: none;
    }
    ul.pages a:hover .name { color: var(--accent); }
    .name {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
    }
    .desc {
      grid-column: 1 / -1;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14.5px;
      max-width: 34em;
    }
    .file {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .wrap { padding-top: 32px; }
      h1 { font-size: 27px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">day04</div>
    <h1>Supabase 연습 프로젝트의 페이지 모음입니다.</h1>

    <ul class="pages">
      <li>
        <a href="preview.html">
          <span class="name">할 일 목록</span>
          <span class="file">preview.html</span>
          <span class="desc">Supabase의 test_todos 표에서 할 일을 불러와 완료 여부, 마감일, 수량과 함께 보여줍니다.</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
